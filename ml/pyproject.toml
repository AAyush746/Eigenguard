[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenguard-ml"
version = "1.0.0"
description = "HTTP traffic feature extraction and anomaly detection for EigenGuard"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["features", "train", "generate_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"